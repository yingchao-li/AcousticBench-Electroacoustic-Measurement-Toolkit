[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acousticbench"
version = "0.1.0"
description = "AcousticBench - Electroacoustic Measurement, Validation & Reporting Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AcousticBench contributors" }]
keywords = [
    "electroacoustics",
    "hearing aids",
    "real-ear measurement",
    "digital signal processing",
    "measurement automation",
    "reproducible research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "h5py>=3.10",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.32",
    "jinja2>=3.1",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pypdf>=4.0",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/example/AcousticBench"
Documentation = "https://github.com/example/AcousticBench#readme"
"Bug Tracker" = "https://github.com/example/AcousticBench/issues"

[project.scripts]
acb = "acousticbench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acousticbench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end checks spanning several modules",
    "regression: golden-value regression checks",
    "slow: tests that take more than a few seconds",
    "requires_data: needs the external Data.mat dataset",
    "requires_matlab: needs a local MATLAB installation",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["acousticbench"]
branch = true
omit = [
    "src/acousticbench/experiments/e*.py",
    "src/acousticbench/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
