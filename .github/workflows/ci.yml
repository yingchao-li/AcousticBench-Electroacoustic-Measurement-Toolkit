# ---------------------------------------------------------------------------
# AcousticBench continuous integration
#
# Runs the data-free test subset on Python 3.10 / 3.11 / 3.12 on every push and
# pull request.  The real 90 MB Data.mat is not required: every test that needs
# it is marked `requires_data` and is deselected here (the fixtures also skip
# cleanly when the file is absent).  Coverage XML is uploaded as an artefact.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONPATH: src
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run data-free test subset with coverage
        run: |
          python -m pytest tests \
            -m "not requires_data" \
            -q \
            --cov=acousticbench \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
